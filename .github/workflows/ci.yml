name: CI Mostro-cli

on:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt -- --check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - name: cargo test
        run: cargo test
      # Already part of the run above; named so a failure says which rule broke:
      # migrated-file size and imports, frozen legacy exceptions, transport
      # ownership, I/O-free renderers, and the compile-fail privacy doctests.
      - name: Source boundary checks
        run: |
          cargo test --locked --test integration_tests source_boundaries
          cargo test --locked --doc
      # Compares the checked-in docs/schemas files with what the binary generates
      # and fails when they differ. It never rewrites them: after an intended
      # change (or a package version bump) regenerate with the commands in
      # docs/commands.md and commit the result.
      - name: Schema drift checks
        run: cargo test --locked --test integration_tests schema_fixtures

  # The pilot's process tests spawn the real binary against loopback relays with
  # generated keys, an allow-listed environment and no shell scripts, secrets or
  # live nodes, so they run unchanged on native Windows. This job is new and
  # independent of the others; it is not a prerequisite of build or release.
  pilot-windows:
    name: Pilot tests (native Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      # Includes the process, grammar, schema-drift and boundary tests. All test
      # binaries run even if one fails, so a first Windows run shows every failure.
      - name: cargo test (native Windows)
        run: cargo test --locked --no-fail-fast

  # The release builds its macOS binaries natively on a macOS runner (cross
  # cannot target Apple). This builds both targets on every push, so a broken
  # macOS build shows up here and not first in a release.
  macos:
    name: macOS build (aarch64 and x86_64)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      # The targets go to the toolchain that rust-toolchain.toml pins.
      - name: Add the Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: cargo build (release, both macOS targets)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - name: cargo build (release)
        run: cargo build --release

  msrv:
    name: MSRV build (1.94.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      # `+1.94.0` overrides rust-toolchain.toml, which pins the newer dev toolchain.
      - name: cargo build (MSRV)
        run: cargo +1.94.0 build --locked --all-features

