[package]
name = "mostro-cli"
version = "0.16.2"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-only"
authors = [
  "Francisco Calderón <fjcalderon@gmail.com>",
  "Baba O'reily <pinballwizard@nostr.red>",
]
description = "Mostro P2P cli client"
homepage = "https://mostro.network"
repository = "https://github.com/MostroP2P/mostro-cli"

[lib]
name = "mostro_client"
path = "src/lib.rs"

[[bin]]
name = "mostro-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
nostr-sdk = { version = "0.45.3" }
# Enable NIP features on `nostr` (re-exported via nostr-sdk::prelude). nip06 is
# required for Keys::from_mnemonic_*; nip44 for protocol DMs and kind-14 chat.
nostr = { version = "0.45.5", default-features = false, features = [
  "std",
  "os-rng",
  "nip06",
  "nip44",
] }
serde = "1.0.219"
serde_json = "1.0.143"
tokio = { version = "1.53.1", features = ["full"] }
comfy-table = "8.0.0"
chrono = "0.4.42"
log = "0.4.34"
futures = "0.3.34"
uuid = { version = "1.18.1", features = [
  "v4",
  "fast-rng",
  "macro-diagnostics",
  "serde",
] }
lightning-invoice = { version = "0.34.1", features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  # Do not enable reqwest's `rustls` feature: it pulls aws-lc-rs, which
  # conflicts with nostr-sdk/tonic `ring` and panics rustls 0.23's
  # process-level CryptoProvider auto-select.
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "ring",
  "tls12",
] }
mostro-core = "=0.14.6"
lnurl-rs = { version = "0.10.0", default-features = false, features = ["ureq"] }
pretty_env_logger = "0.5.0"
sqlx = { version = "0.9.0", features = [
  "sqlite",
  "runtime-tokio",
  "tls-rustls-ring",
] }
bip39 = { version = "3.0.0", features = ["rand"] }
dirs = "7.0.0"
chacha20poly1305 = "0.11.0"
rand_core = "0.10.1"
secp256k1 = "0.30"
bitcoin_hashes = { version = "1.2.0", default-features = false }
base64 = "0.23.1"
# Admin gRPC (mostrod `[rpc]`): hand-written prost messages + tonic client,
# no protoc / build.rs needed to `cargo install`.
tonic = { version = "0.14.2", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14.1"
prost = "0.14.1"

[package.metadata.release]
# (Default: true) Set to false to prevent automatically running `cargo publish`.
publish = false
# (Default: true) Set to false to prevent automatically pushing commits and tags to the Git remote.
push = true
# (Default: true) Run `cargo test` before release? Highly recommended.
verify = true
# (Default: true) Create a Git tag for the release (e.g., v0.2.1)? You usually want this.
tag = true
# (Default: false) Sign the release commit with GPG?
sign-commit = true
# (Default: false) Sign the release tag with GPG?
sign-tag = true
# Generate CHANGELOG.md before creating the release tag (only during actual release, not dry-run)
pre-release-hook = [
  "sh",
  "-c",
  "cargo fmt --all && cargo clippy --all-targets --all-features -- -D warnings && if [ -n \"${GITHUB_TOKEN:-}\" ]; then GITHUB_TOKEN=\"$GITHUB_TOKEN\" git cliff --unreleased --github-repo MostroP2P/mostro-cli -o CHANGELOG.md --tag {{version}}; else git cliff --unreleased -o CHANGELOG.md --tag {{version}}; fi && if [ \"$DRY_RUN\" != \"true\" ]; then git diff --quiet CHANGELOG.md || git add CHANGELOG.md && git commit -m \"Update CHANGELOG for version {{version}}\"; else echo \"DRY RUN: Skip git add and commit\"; fi",
]

[dev-dependencies]
tokio-test = "0.4"
serial_test = "4.0.1"
rstest = "0.27.0"
